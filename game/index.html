<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Neon Bay — Open World Crime</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07070f;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;color:#e8f0ff}
#c{display:block;margin:0 auto;background:#12122a;cursor:crosshair}
#ui{position:fixed;inset:0;pointer-events:none}
#hud{position:absolute;top:10px;left:12px;font-size:13px;line-height:1.55;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:8px}
#mm{position:absolute;top:10px;right:12px;width:132px;height:132px;border:2px solid #3cf;border-radius:6px;background:rgba(0,0,0,.65)}
#titlewrap{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;pointer-events:none}
#titlewrap h1{margin:0;font-size:48px;letter-spacing:3px;font-weight:800;color:#3cf;text-shadow:0 0 24px #3cf8}
#titlewrap p{opacity:.85;margin:10px 0 0;font-size:15px;max-width:420px}
#start{pointer-events:auto;position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);padding:14px 40px;font-size:18px;font-weight:700;border:0;border-radius:10px;background:linear-gradient(180deg,#5ff,#2ad);color:#021;cursor:pointer;box-shadow:0 4px 20px #3cf6}
#start:hover{filter:brightness(1.1)}
#banner{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:10px 18px;border-radius:10px;font-size:14px;max-width:75%;text-align:center;display:none}
#help{position:absolute;bottom:12px;left:12px;font-size:11px;opacity:.55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mm"></canvas>
<div id="ui">
  <div id="hud" style="display:none"></div>
  <div id="titlewrap">
    <h1>NEON BAY</h1>
    <p>Open-world crime · steal cars · evade police · complete missions</p>
  </div>
  <button id="start">START GAME</button>
  <div id="banner"></div>
  <div id="help">WASD move · mouse look · Space attack · E enter/exit car · F objective</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
